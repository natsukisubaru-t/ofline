name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android files and build APK
        run: |
          cp lib/main.dart main.dart.bak
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --platforms=android --org com.subaru.offlinetube .
          mv main.dart.bak lib/main.dart
          mv pubspec.yaml.bak pubspec.yaml
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><application/' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineTube-APK
          path: build/app/outputs/flutter-apk/app-release.apk


